services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: helpdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${GatewayProj}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - helpdesk_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  helpdesk_sql_data: