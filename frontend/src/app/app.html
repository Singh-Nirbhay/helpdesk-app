<div class="app-shell">

  <header class="app-header">

    <a routerLink="/dashboard" class="app-brand">
      HelpDesk Application
    </a>

    @if (authService.isAuthenticated()) {

    @if (authService.session(); as session) {

    <div class="account-section">

      <div class="account-details">
        <span class="account-name">
          {{ session.fullName }}
        </span>

        <span class="account-role">
          {{ session.role }}
        </span>
      </div>

      <button type="button"
              class="logout-button"
              (click)="logout()">
        Logout
      </button>

    </div>

    }

    } @else {

    <a routerLink="/login" class="login-link">
      Sign in
    </a>

    }

  </header>

  @if (!authService.isAuthenticated()) {
  @if (logoutError(); as message) {
  <div class="shell-error" role="alert">
    {{ message }}
    <a routerLink="/login">Open sign-in page</a>
  </div>
  }
  }

  <main class="app-content">
    <router-outlet />
  </main>

</div>
